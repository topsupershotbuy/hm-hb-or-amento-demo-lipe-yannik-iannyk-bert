<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Fast Design - HiperMilhas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            background: #c94b8c;
        }

        .background-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .background-texture {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .geometric-waves {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 50%;
            object-fit: cover;
            object-position: bottom;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            padding: 20px;
            min-height: 100vh;
        }

        .download-button-container {
            position: fixed;
            top: 60px;
            right: 100px;
            z-index: 100;
        }

        .download-button {
            width: 200px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: block;
        }

        .download-button:hover { transform: scale(1.08); }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            max-width: 1100px;
            margin: 140px auto 100px;
            padding: 0 20px;
        }

        .template-item {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .template-item:hover { transform: translateY(-8px); }

        .template-item img { width: 100%; display: block; }

        .signature-container {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            z-index: 100;
        }

        .signature-container img { width: 100%; }

        .logo-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 300px;
            z-index: 100;
        }

        .logo-container img { width: 100%; }

        @media (max-width: 1200px) {
            .templates-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
            .download-button-container { right: 50px; top: 40px; }
            .download-button { width: 160px; }
        }

        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 120px;
            }
            .download-button-container { right: 20px; top: 20px; }
            .download-button { width: 140px; }
            .logo-container { width: 200px; bottom: 20px; right: 20px; }
            .signature-container { width: 60px; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <img src="assets/images/fundo.png"  alt="Background" class="background-texture">
        <img src="assets/images/ondas.png"  alt="Waves"      class="geometric-waves">
    </div>

    <div class="content-wrapper">
        <div class="download-button-container">
            <a href="orcamento.html">
                <img src="assets/images/download.png" alt="Download" class="download-button">
            </a>
        </div>

        <div class="templates-grid">
            <div class="template-item">
                <img src="assets/images/template1.png" alt="Template 1">
            </div>
            <div class="template-item">
                <img src="assets/images/template2.png" alt="Template 2">
            </div>
            <div class="template-item">
                <img src="assets/images/template3.png" alt="Template 3">
            </div>
            <div class="template-item">
                <img src="assets/images/template4.png" alt="Template 4">
            </div>
        </div>

        <div class="signature-container">
            <img src="assets/images/assinatura.png" alt="Signature">
        </div>

        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Track Fast Design">
        </div>
    </div>
</body>
</html>
